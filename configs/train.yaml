# Final fixed cohort: raw numerical values; standardization is fitted on training patients.
data:
  root: ../data/Mutimodel_data/固定训练数据
  horizon: 6  # Fixed cohort supports 1, 2, 3, 6; one task per run.
text:
  backend: macbert
  model_name: ../models/chinese-macbert-base
  local_files_only: true
  revision: main  # Resolved immutable weight revision + tokenizer hash saved in artifact.
  max_tokens: 512
  batch_size: 16
  cache_dir: ../runs/macbert_cache
  device: auto  # Prefer CUDA; explicit cuda:0 fails early if CUDA is unavailable.
  precision: auto  # CUDA BF16 when supported, otherwise FP16; CPU uses FP32.
model:
  vital_only: false  # --vital_only selects the 20-channel vital-only model and skips labs, notes, static inputs.
  vital_encoder: tcn  # Set per experiment from training.models.
  rnn_hidden: 64
  rnn_layers: 2  # LSTM/GRU only; GRU-D uses one decay cell layer.
  fusion: gated
  embedding_dim: 128
  static_dim: 32
  tcn_channels: 64
  tcn_blocks: 5
  kernel_size: 3
  max_time_steps: 120
  lab_hidden: 256
  dropout: 0.1
  modality_dropout: 0.1
news2:
  rules_file: news2_rules.yaml  # All clinical scoring bands and the alarm threshold.
  batch_size: 256
xgboost:
  num_boost_round: 500
  early_stopping_rounds: 30
  max_depth: 6
  learning_rate: 0.05
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  max_bin: 256
  batch_size: 16384  # Disk feature batches; CPU hist external-memory training.
  nthread: 4
training:
  models: [tcn, lstm, gru, grud, news2]  # NEWS2 is evaluated directly without training.
  seed: 42
  batch_size: 16
  epochs: 50
  patience: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  class_weight: false
  calibration: false
  threshold: null
  device: auto
  precision: auto
  deterministic: true  # false enables cuDNN autotuning; true requests deterministic experiments.
  output_dir: ../runs  # Each run creates <model>/<timestamp>/ here.

